<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FLARE — Start a Project</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin">

  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://flareevents.in/contact.html">

<meta name="description" content="Contact FLARE for events, brand experiences, creator partnerships and collaborations.">
</head>

<body>

<header class="site-header">

  <a href="index.html" class="brand-logo">
    <img src="flare-logo.png" alt="FLARE">
  </a>

  <nav class="desktop-nav">
    <a href="index.html#idea">About</a>
    <a href="index.html#services">Services</a>
    <a href="index.html#work">Work</a>
    <a href="contact.html">Start a Project ↗</a>
  </nav>

  <button class="menu-button">
    <span></span>
    <span></span>
  </button>

</header>


<main class="inner-page">

  <section class="contact-section">

    <div class="contact-grid">

      <div class="contact-heading">

        <span class="eyebrow">
          FLARE / START A PROJECT
        </span>

        <h1>
          LET'S<br>
          TALK.
        </h1>

        <p>
          Tell us what you're building, what you're
          thinking about or simply what you want to
          make happen.
        </p>

        <p>
          <strong>book.flareevents@gmail.com</strong>
        </p>

      </div>


      <form
        class="project-form"
        action="https://formsubmit.co/book.flareevents@gmail.com"
        method="POST"
      >

        <input
          type="hidden"
          name="_subject"
          value="New FLARE Website Enquiry"
        >

        <input
          type="hidden"
          name="_captcha"
          value="false"
        >

        <input
          type="hidden"
          name="_template"
          value="table"
        >


        <div class="form-field">

          <label for="name">
            Your Name
          </label>

          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your name"
            required
          >

        </div>


        <div class="form-field">

          <label for="email">
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            placeholder="you@email.com"
            required
          >

        </div>


        <div class="form-field">

          <label for="company">
            Company / Brand
          </label>

          <input
            id="company"
            name="company"
            type="text"
            placeholder="Company name"
          >

        </div>


        <div class="form-field">

          <label for="project">
            What do you need?
          </label>

          <select
            id="project"
            name="project"
            required
          >

            <option value="">
              Select an option
            </option>

            <option value="Brand Campaign">
              Brand Campaign
            </option>

            <option value="Creator Campaign">
              Creator Campaign
            </option>

            <option value="Event / Experience">
              Event / Experience
            </option>

            <option value="Brand Collaboration">
              Brand Collaboration
            </option>

            <option value="Other">
              Something else
            </option>

          </select>

        </div>


        <div class="form-field">

          <label for="message">
            Tell us about it
          </label>

          <textarea
            id="message"
            name="message"
            placeholder="A little context goes a long way..."
            required
          ></textarea>

        </div>


        <button
          type="submit"
          class="form-submit"
        >
          SEND ENQUIRY ↗
        </button>

      </form>

    </div>

  </section>


  <section class="big-cta">

    <div class="cta-inner">

      <span class="eyebrow">OTHER WAYS TO CONNECT</span>

      <h2>
        FIND<br>
        <span>FLARE.</span>
      </h2>

      <div class="social-icons">

        <a
          href="https://www.instagram.com/weareflare.in"
          target="_blank"
          aria-label="Instagram"
        >
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1"></circle>
          </svg>
        </a>


        <a
          href="https://www.facebook.com/share/17yEoZoNkn/"
          target="_blank"
          aria-label="Facebook"
        >
          <svg viewBox="0 0 24 24">
            <path d="M14 8h3V4h-3c-3.3 0-5 2-5 5v3H6v4h3v4h4v-4h3l1-4h-4V9c0-.7.3-1 1-1z"></path>
          </svg>
        </a>


        <a
          href="https://www.linkedin.com/company/flare-events-india/"
          target="_blank"
          aria-label="LinkedIn"
        >
          <svg viewBox="0 0 24 24">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
            <path d="M8 10v6M8 7.5v.1M12 16v-6M12 13c0-2 1-3 3-3s3 1.2 3 3v3"></path>
          </svg>
        </a>

      </div>

    </div>

  </section>

</main>


<footer class="footer">

  <img src="flare-logo.png" alt="FLARE">

  <div class="footer-bottom">
    <span>© 2026 FLARE</span>
    <span>EVENTS · INFLUENCE · EXPERIENCES</span>
  </div>

</footer>


<script src="script.js"></script>

</body>
</html>
